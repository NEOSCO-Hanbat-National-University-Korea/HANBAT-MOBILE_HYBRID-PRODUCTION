  <script>
    // find query parameter "debug" and if it exists, set localStorage.debug to its value
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get("mode");
    const sessionEnc = urlParams.get("sessionEnc");
    const userId = urlParams.get("userId");
    if (mode && mode === "nativeApp") { sessionStorage.setItem("isNativeApp", "true"); }
    if (sessionEnc || userId) { sessionStorage.setItem("sessionEnc", sessionEnc || userId); }
  </script>
